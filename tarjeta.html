<!DOCTYPE html>
<html>
<head>
  <title>Tarjeta Raspa y Gana</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
      margin: 0;
      overflow: hidden; /* Evita que la pantalla se mueva */
    }

    .contenedor {
      position: relative;
      display: inline-block;
    }

    #imagen {
      display: block;
      max-width: 100%;
      height: auto;
    }

    #capa {
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <img src="tarjeta.png" id="imagen">
    <canvas id="capa"></canvas>
  </div>

  <script>
    var imagen = document.getElementById("imagen");
    var canvas = document.getElementById("capa");
    var ctx = canvas.getContext("2d");

    imagen.onload = function() {
      canvas.width = imagen.width;
      canvas.height = imagen.height;
      ctx.fillStyle = "silver";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    };

    function raspar(x, y) {
      ctx.globalCompositeOperation = "destination-out"; 
      ctx.beginPath();
      ctx.arc(x, y, 160, 0, Math.PI * 2); // círculo mucho más grande (160px)
      ctx.fill();
    }

    // Mouse
    canvas.addEventListener("mousemove", function(e) {
      if (e.buttons === 1) {
        raspar(e.offsetX, e.offsetY);
      }
    });

    // Touch en móvil
    canvas.addEventListener("touchmove", function(e) {
      e.preventDefault(); // Bloquea el scroll
      var rect = canvas.getBoundingClientRect();
      var x = e.touches[0].clientX - rect.left;
      var y = e.touches[0].clientY - rect.top;
      raspar(x, y);
    }, { passive: false });
  </script>
</body>
</html>
