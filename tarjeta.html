<!DOCTYPE html>
<html>
<head>
  <title>Tarjeta Raspa y Gana</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
      margin: 0;
      overflow: hidden; /* Evita que la pantalla se mueva */
    }

    .contenedor {
      position: relative;
      display: inline-block;
    }

    #imagen {
      display: block;
      max-width: 100%;
      height: auto;
    }

    #capa {
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <img src="tarjeta.png" id="imagen">
    <canvas id="capa"></canvas>
  </div>

  <script>
    var imagen = document.getElementById("imagen");
    var canvas = document.getElementById("capa");
    var ctx = canvas.getContext("2d");

    imagen.onload = function() {
      canvas.width = imagen.width;
      canvas.height = imagen.height;
      ctx.fillStyle = "silver";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    };

    // Configuración de la brocha
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.lineWidth = 80; // grosor de la brocha

    let pintando = false;

    function empezar(x, y) {
      pintando = true;
      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    function dibujar(x, y) {
      if (!pintando) return;
      ctx.lineTo(x, y);
      ctx.stroke();
    }

    function terminar() {
      pintando = false;
      ctx.closePath();
    }

    // Mouse
    canvas.addEventListener("mousedown", function(e) {
      empezar(e.offsetX, e.offsetY);
    });
    canvas.addEventListener("mousemove", function(e) {
      dibujar(e.offsetX, e.offsetY);
    });
    canvas.addEventListener("mouseup", terminar);
    canvas.addEventListener("mouseleave", terminar);

    // Touch en móvil
    canvas.addEventListener("touchstart", function(e) {
      e.preventDefault();
      var rect = canvas.getBoundingClientRect();
      empezar(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
    }, { passive: false });

    canvas.addEventListener("touchmove", function(e) {
      e.preventDefault();
      var rect = canvas.getBoundingClientRect();
      dibujar(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
    }, { passive: false });

    canvas.addEventListener("touchend", terminar);
  </script>
</body>
</html>
